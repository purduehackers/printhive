# Insert into an existing HTTPS server block with your certificates configured.
# Proxy directly to the private Podman port. Do not expose port 4321 publicly.
location / {
    client_max_body_size 500m;
    client_body_timeout 1800s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_pass http://127.0.0.1:4321;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# At the http level, use $uri (not $request or $request_uri) in your log_format
# to avoid logging confirmation tokens. Disable request-body logging as well.
